apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: production
  namespace: metallb
spec:
  ipAddressPools:
  - ippoolproduction
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ippoolproduction
  namespace: metallb
spec:
  # Production services will go here. Public IPs are expensive, so we leased
  # just 4 of them.
  addresses:
  - 192.168.185.4/30
